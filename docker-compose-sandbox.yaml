version: '3.8'

services:
  app:
    image: matiasbasile/varcreative
    container_name: demo-entrenaymas-app
    restart: always
    working_dir: /var/www/
    environment:
      - DATABASE=${DATABASE}
      - PASSWORD_DB=${PASSWORD_DB}
      - SERVER_DB=${SERVER_DB}
      - PROJECT_NAME=${PROJECT_NAME}
      - URL_BASE=${URL_BASE}
      - PAYCOMET_TERMINAL=${PAYCOMET_TERMINAL}
      - PAYCOMET_CODE=${PAYCOMET_CODE}
      - PAYCOMET_JET_ID=${PAYCOMET_JET_ID}
      - PAYCOMET_PASSWORD=${PAYCOMET_PASSWORD}
      - GOOGLE_SMTP_HOST=${GOOGLE_SMTP_HOST}
      - GOOGLE_SMTP_PORT=${GOOGLE_SMTP_PORT}
      - GOOGLE_SMTP_USER=${GOOGLE_SMTP_USER}
      - GOOGLE_SMTP_PASSWORD=${GOOGLE_SMTP_PASSWORD}
    volumes:
      - .:/var/www

  nginx:
    image: matiasbasile/nginx
    container_name: demo-entrenaymas-nginx
    restart: always
    ports:
      - ${NGINX_PORT}:80
    volumes:
      - .:/var/www
      - ./docker/nginx:/etc/nginx/conf.d/
    environment:
      - SERVER_DB:"demo-entrenaymas-mysql"

  mysql:
    image: mysql:5.7
    restart: always
    container_name: demo-entrenaymas-mysql
    command: mysqld --sql_mode=""
    environment:
      - MYSQL_ROOT_PASSWORD=${PASSWORD_DB}
      - MYSQL_DATABASE=${DATABASE}
    volumes:
      - demo-entrenaymas-data:/var/lib/mysql

volumes:
  demo-entrenaymas-data:

networks: 
  default: 
    external: 
      name: varcreative-network