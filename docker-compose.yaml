version: '3.8'

services:
  app:
    image: matiasbasile/varcreative
    container_name: entrenaymas-app
    restart: always
    working_dir: /var/www/
    environment:
      - DATABASE=${DATABASE}
      - PASSWORD_DB=${PASSWORD_DB}
      - SERVER_DB=${SERVER_DB}
      - PROJECT_NAME=${PROJECT_NAME}
      - URL_BASE=${URL_BASE}
      - PAYCOMET_TERMINAL=${PAYCOMET_TERMINAL}
      - PAYCOMET_CODE=${PAYCOMET_CODE}
      - PAYCOMET_JET_ID=${PAYCOMET_JET_ID}
      - PAYCOMET_PASSWORD=${PAYCOMET_PASSWORD}
    volumes:
      - .:/var/www

  nginx:
    image: matiasbasile/nginx
    container_name: entrenaymas-nginx
    restart: always
    ports:
      - ${NGINX_PORT}:80
      - "443:443"
    volumes:
      - .:/var/www
      - ./docker/nginx:/etc/nginx/conf.d/
    environment:
      - SERVER_DB:"entrenaymas-mysql"

  mysql:
    image: matiasbasile/mysql
    restart: always
    command: mariadbd --sql_mode=""
    container_name: entrenaymas-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${PASSWORD_DB}
      - MYSQL_DATABASE=${DATABASE}
    volumes:
      - entrenaymas-data:/var/lib/mysql

volumes:
  entrenaymas-data:

networks: 
  default: 
    external: 
      name: varcreative-network